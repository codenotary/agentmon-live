<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentMon Live</title>
<script>
// Before the first paint, so the theme never flashes the other one. Dark unless a person chose otherwise.
let t = null
try { t = localStorage.getItem('agentmon-live-theme') } catch {}
if (t !== 'auto') document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
