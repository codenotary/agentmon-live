<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentMon Live</title>
<script>
// Before the first paint, so a person's chosen theme never flashes the other one.
try { const t = localStorage.getItem('agentmon-live-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t } catch {}
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
